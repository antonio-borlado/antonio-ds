name: Release
# Merge to main = publish. Pending changesets are versioned, committed back and published to npm,
# then jsDelivr is purged so CDN consumers get the update within minutes.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build && npm test
      - name: Version
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            npx changeset version
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: release"
            git push
          fi
      - name: Publish
        run: npm run release && git push --follow-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Purge jsDelivr
        run: node scripts/purge-cdn.mjs
